name: Release

# Builds Hyperliquid.dll (production, 32-bit) when a v* tag is pushed and
# attaches the DLL to the corresponding GitHub Release. If a Release already
# exists for the tag (e.g. created manually via `gh release create`), the DLL
# is uploaded to that Release; otherwise a new Release is created from the
# CHANGELOG.md section matching the tag.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    # Pinned to windows-2022 (Visual Studio 2022). windows-latest moved to the
    # VS18 image, where the "Visual Studio 17 2022" CMake generator no longer
    # resolves ("could not find any instance of Visual Studio"). Pin keeps the
    # 32-bit VS2022 toolchain Zorro requires. Revisit when adding VS18 support.
    runs-on: windows-2022

    # Disable vcpkg binary caching. vcpkg auto-selects the GitHub Actions
    # ("x-gha") binary source on Actions runners, which requires
    # ACTIONS_RUNTIME_TOKEN + ACTIONS_CACHE_URL — not exported into this job,
    # so CMake configure aborted ("GHA binary source requires ..."). Clearing
    # the binary sources builds the single dependency (IXWebSocket) from source.
    env:
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify CMakeLists.txt version matches tag
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::CMakeLists.txt version ($ACTUAL) does not match tag ($EXPECTED)"
            exit 1
          fi
          echo "Version OK: $ACTUAL"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Developer Command Prompt (Win32)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Must be a full 40-char commit SHA, not a release tag — run-vcpkg
          # rejects tags ("commit id must be a full SHA1 hash"). This SHA is the
          # 2026.01.16 release tag: run `git ls-remote --tags` and take the
          # dereferenced `^{}` entry, because an annotated tag's own object SHA
          # is not a commit. Keep in step with ci.yml and vcpkg.json.
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
          runVcpkgInstall: false

      # Proprietary Zorro SDK headers (not committed — include/ is gitignored).
      # Extracted from the official Zorro beta distribution; no secret needed.
      # The installer is never run — we only unzip the two headers we need.
      - name: Cache Zorro SDK zip
        id: zorro-cache
        uses: actions/cache@v4
        with:
          path: zorro-sdk.zip
          key: zorro-beta-sdk-zip-v1
      - name: Download Zorro beta (for SDK headers)
        if: steps.zorro-cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fsSL -o zorro-sdk.zip https://opserver.de/down/ZorroBeta.zip
      - name: Stage Zorro SDK headers
        shell: bash
        run: |
          mkdir -p include
          unzip -o -j zorro-sdk.zip "ZorroBeta/include/trading.h" "ZorroBeta/include/variables.h" -d include
          test -f include/trading.h && test -f include/variables.h
          echo "Staged trading.h + variables.h into include/"

      - name: Configure CMake (production, Win32, DEV_BUILD=OFF)
        shell: cmd
        run: |
          mkdir build_prod
          cd build_prod
          cmake .. -G "Visual Studio 17 2022" -A Win32 -DDEV_BUILD=OFF ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build Hyperliquid.dll
        shell: cmd
        run: cmake --build build_prod --config Release

      - name: Verify DLL produced
        shell: bash
        run: |
          if [ ! -f "build_prod/Release/Hyperliquid.dll" ]; then
            echo "::error::Hyperliquid.dll not produced"
            exit 1
          fi
          echo "DLL size: $(stat -c%s build_prod/Release/Hyperliquid.dll 2>/dev/null || wc -c < build_prod/Release/Hyperliquid.dll) bytes"

      - name: Run unit tests (price cache)
        shell: cmd
        run: |
          build_prod\Release\test_ws_price_cache.exe

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG entry found for version $VERSION"
            NOTES="Release $VERSION — see CHANGELOG.md for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: build_prod/Release/Hyperliquid.dll
          fail_on_unmatched_files: true
